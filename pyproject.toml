[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp4d"
version = "0.1.0"
description = "Minimal DROID geometry/TCP training and RoboTwin action generation"
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["tcp4d*", "scripts*", "aug_pipeline", "aug_pipeline.droid", "aug_pipeline.droid.ik"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
visualization = ["gradio>=6,<7", "viser>=1.1,<2", "opencv-python>=4.10,<5"]
aug-web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "PyYAML>=6,<7", "scipy>=1.11,<1.16", "imageio>=2.34,<3", "imageio-ffmpeg>=0.5,<1", "opencv-python>=4.10,<4.12", "psutil>=5"]
aug-ik = ["sapien==3.0.0b1", "numpy==1.26.4", "trimesh>=4.4,<5", "pybind11>=2.13,<3", "setuptools-scm>=8,<9", "ninja>=1.11", "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@v0.7.8"]
aug-sam3 = ["sam3 @ git+https://github.com/facebookresearch/sam3.git@f92a5efc4001ebfe9d050d43e61f6fb10e02d73c", "numpy==1.26.4", "pandas>=2.2,<3", "setuptools>=68,<81", "pycocotools>=2.0.8", "psutil>=5", "einops>=0.8,<0.9", "opencv-python>=4.10,<4.12"]
aug-inpaint = ["av>=12,<19", "future>=1,<2", "matplotlib>=3.8,<4", "scikit-image>=0.22,<0.27", "requests>=2.31,<3", "timm>=1.0.17,<1.1", "yapf>=0.40,<1"]
aug = ["tcp4d[aug-web,aug-ik,aug-sam3,aug-inpaint]"]

[project.scripts]
tcp4d-aug = "aug_pipeline.cli:main"

[tool.setuptools.package-data]
aug_pipeline = ["config.example.yaml", "resources.json", "frontend/dist/**/*", "droid/*.json", "droid/ik/*.yml"]
